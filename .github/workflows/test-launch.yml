name: Test server launches without errors

on:
  push:
    branches: [ main, master, release/** ]
  pull_request:
    branches: [ main, master, release/** ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ComfyUI
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: "Comfy-Org/ComfyUI"
          path: "ComfyUI"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install requirements
        working-directory: ComfyUI
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install wait-for-it

      - name: Start ComfyUI server
        working-directory: ComfyUI
        run: |
          python main.py --cpu 2>&1 | tee console_output.log &
          wait-for-it --service 127.0.0.1:8188 -t 30

      - name: Check for unhandled exceptions in server log
        working-directory: ComfyUI
        run: |
          set -euo pipefail

          grep -v "Found comfy_kitchen backend triton: {'available': False, 'disabled': True, 'unavailable_reason': \"ImportError: No module named 'triton'\", 'capabilities': \[\]}" console_output.log \
            | grep -v "Found comfy_kitchen backend triton: {'available': False, 'disabled': False, 'unavailable_reason': \"ImportError: No module named 'triton'\", 'capabilities': \[\]}" \
            > console_output_filtered.log

          if [ ! -s console_output_filtered.log ]; then
            echo "No server log lines remained after filtering Triton backend diagnostics."
            exit 1
          fi

          cat console_output_filtered.log

          if grep -qE "Exception|Error" console_output_filtered.log; then
            echo "Unhandled exception/error found in server log."
            exit 1
          fi

      - name: Upload console output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: console-output
          path: ComfyUI/console_output.log
          retention-days: 30
